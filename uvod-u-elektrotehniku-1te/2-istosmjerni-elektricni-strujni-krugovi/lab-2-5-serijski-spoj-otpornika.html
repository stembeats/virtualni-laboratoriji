<!DOCTYPE html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtualni laboratorij</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap"><style>
/* Koncept: radni stol u školskom laboratoriju. Gore traka s nazivom i karticama, ispod "stol" s instrumentima, ispod zadaci i pitanja. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#1b2422; --muted:#56635e; --line:#d2d9d5;
  --accent:#0b7a6b; --accent-ink:#ffffff; --warn:#a85a00; --chip:#e3ebe7;
  --badge:#10181a;
  --f-head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-lcd:'Share Tech Mono','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111716; --panel:#192120; --ink:#e5ebe8; --muted:#9aa8a2; --line:#2d3836;
    --accent:#42c6b0; --accent-ink:#06211c; --warn:#f0a64a; --chip:#232d2b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111716; --panel:#192120; --ink:#e5ebe8; --muted:#9aa8a2; --line:#2d3836;
  --accent:#42c6b0; --accent-ink:#06211c; --warn:#f0a64a; --chip:#232d2b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{display:block;background:var(--badge);border-radius:10px;padding:6px;line-height:0;flex:none}
.logo img{height:68px;width:auto;display:block}
.logo:focus-visible,.tab:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.titles{min-width:0;flex:1 1 280px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,4.6vw,38px);line-height:1.05;margin:0;letter-spacing:.2px;text-wrap:balance}
.by{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.by a{color:var(--accent);font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 14px var(--f-head);letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
h2{font-family:var(--f-head);font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:700}
h3{font-family:var(--f-head);font-size:19px;margin:22px 0 6px;font-weight:600;letter-spacing:.2px}
.lead{color:var(--muted);margin:0 0 12px;max-width:70ch}
ol.q{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;max-width:74ch}
ol.q li::marker{font-family:var(--f-head);font-weight:700;color:var(--accent)}
.note{background:var(--chip);border-radius:8px;padding:10px 14px;font-size:14px;max-width:74ch;margin:12px 0 0}
.note b{font-weight:600}
.bench-wrap{border:1px solid #0d1514;border-radius:10px;overflow-x:auto;background:#2b3a38}
.bench{min-width:820px;display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bench [data-act]{cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{font:600 13px var(--f-head);letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.teacher{border:1px dashed var(--warn);border-radius:10px;padding:14px 18px;margin-top:18px}
.teacher h3{margin-top:0;color:var(--warn)}
.teacher table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.teacher th,.teacher td{border:1px solid var(--line);padding:4px 9px;text-align:right}
.scroll{overflow-x:auto}
footer{color:var(--muted);font-size:13px;max-width:80ch}
footer a{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
@media (max-width:560px){.card{padding:16px 14px}.logo img{height:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- dodatak: instrumenti i sheme ---- */
.bench2{display:flex;flex-direction:column}
.schemwrap{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow-x:auto;--tp:var(--accent)}
.schem{display:block;width:100%;min-width:680px;height:auto;color:var(--ink);user-select:none;-webkit-user-select:none}
.tp{cursor:pointer;outline:none}
.tpc{fill:var(--panel);stroke:var(--accent);stroke-width:2.6}
.tp:hover .tpc,.tp:focus-visible .tpc{fill:var(--accent)}
.tp.red .tpc{fill:#e0483a;stroke:#9b241b}
.tp.blk .tpc{fill:#2a2f31;stroke:#000}
.tp.c1 .tpc{stroke:#e8b600;stroke-width:4.5}
.tp.c2 .tpc{stroke:#0aa5d8;stroke-width:4.5}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:14px;margin-top:14px}
.ic{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.ic.wide{grid-column:1/-1}
.ic h4{font:700 15px var(--f-head);letter-spacing:.5px;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
.prow{display:grid;grid-template-columns:92px minmax(0,1fr) 92px;gap:10px;align-items:center;margin:8px 0}
.prow.sel{grid-template-columns:128px minmax(0,1fr)}
.prow label{font-size:14px}
.prow input[type=range]{width:100%;accent-color:var(--accent)}
.prow output{font:500 14px var(--f-lcd);text-align:right;white-space:nowrap}
.prow select,.chb select{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.krow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:-2px 0 8px}
.kb{font:600 13px var(--f-lcd);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:5px;padding:3px 8px;cursor:pointer}
.kb:hover{border-color:var(--accent)}
.lcd{background:#0c1a12;color:#6df0a8;border-radius:8px;padding:10px 14px;font-family:var(--f-lcd);display:flex;align-items:baseline;gap:8px;margin-bottom:10px;border:2px solid #07110b}
.lcd #lcdv{font-size:40px;line-height:1;letter-spacing:1px;flex:1;text-align:right}
.lcd #lcdu{font-size:22px;min-width:2.6em}
.lcd #lcdm{font-size:13px;opacity:.8;min-width:5.2em;text-align:right}
.seg{display:flex;gap:0;margin-bottom:8px}
.seg button{flex:1;font:600 14px var(--f-lcd);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 4px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dotr,.dotb{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.dotr{background:#e0483a}.dotb{background:#2a2f31;border:1px solid var(--muted)}
.pick{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px;align-items:center}
.pick label{display:flex;gap:4px;align-items:center;color:var(--ink)}
.scopegrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.scopegrid{grid-template-columns:1fr}}
.scope canvas,.bode canvas,.ll canvas{width:100%;height:auto;display:block;border-radius:8px;border:1px solid #0d1514}
.bode canvas,.ll canvas{border:1px solid var(--line);background:var(--bg)}
.scrd{font:500 14px var(--f-lcd);margin-top:6px;min-height:22px;color:var(--muted)}
.scrd b{color:var(--ink)}
.scctl{display:flex;flex-direction:column;gap:10px}
.chb{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chb b{font:700 14px var(--f-head);letter-spacing:.5px}
.chb.c1 b{color:#c99a00}.chb.c2 b{color:#0786b3}
.chb label{display:flex;gap:6px;align-items:center;justify-content:space-between}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:var(--muted)}
.ans{margin-top:6px;padding:6px 10px;border-left:3px solid var(--warn);background:rgba(168,90,0,.07);font-size:14px;border-radius:0 6px 6px 0}
.ans.wide{max-width:none}
.zad{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;display:grid;gap:10px}
.zad .zadf{max-width:420px}
.zad .zadf svg{width:100%;height:auto;color:var(--ink)}
.tt{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin:6px 0}
.tt th,.tt td{border:1px solid var(--line);padding:3px 9px;text-align:right;white-space:nowrap}
.tt th{background:var(--chip);font-weight:600}
.teacher p{margin:6px 0;font-size:14px;max-width:80ch}
.teacher h5{font:700 15px var(--f-head);margin:12px 0 2px;letter-spacing:.3px}
.formula{font-family:'IBM Plex Sans',serif;font-style:normal}
.task .step-fig{margin:8px 0}
@media (max-width:560px){.prow{grid-template-columns:78px minmax(0,1fr) 78px}.lcd #lcdv{font-size:32px}}
.inst-grid>*{min-width:0}
.prow select,.chb select{min-width:0;width:100%;text-overflow:ellipsis}.prow>*{min-width:0}@media (max-width:560px){.prow.sel{grid-template-columns:96px minmax(0,1fr)}}
@media (max-width:560px){.prow output{white-space:normal;overflow-wrap:anywhere;font-size:12px}}
:root{--benchbg:#e6ebe7}
@media (prefers-color-scheme:dark){:root{--benchbg:#1a2220}}
.bench2{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.wbwrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--benchbg);touch-action:pan-y}
.wbsvg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;color:var(--ink);touch-action:pan-y}
.wbsvg text{font-family:'IBM Plex Sans',Arial,sans-serif;pointer-events:none}
.wbsvg .lcd{font-family:'Share Tech Mono','Courier New',monospace;fill:#1f2b17;font-weight:700}
.term{cursor:crosshair}
.term .ring{transition:stroke .1s}
.term:hover .ring,.term.arm .ring{stroke:#f2b705;stroke-width:4}
.term.pulse .ring{stroke:#ff3b2e;stroke-width:5;animation:wbpulse .7s ease-in-out infinite}
@keyframes wbpulse{50%{stroke-width:9;stroke:#ffb300}}
.wire{cursor:pointer}
.wire.sel .wc{stroke-dasharray:14 6}
@keyframes wbflow{to{stroke-dashoffset:-16}}
.smoke circle{animation:wbsmoke 1.8s ease-out infinite}
@keyframes wbsmoke{from{transform:translateY(0);opacity:.9}to{transform:translateY(-20px);opacity:0}}
.wbtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 6px}
.wbl{font-size:13px;color:var(--muted)}
.wcol{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.wcol.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}
button.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.btn.warnb{border-color:var(--warn);color:var(--warn)}
.wbmsg{min-height:22px;font-size:14.5px;padding:6px 10px;border-radius:8px;margin:4px 0 8px}
.wbmsg:empty{display:none}
.wbmsg.ok{background:rgba(11,122,107,.14);border-left:4px solid var(--accent)}
.wbmsg.bad{background:rgba(196,52,38,.13);border-left:4px solid #c43426}
.wbmsg.warn{background:rgba(168,90,0,.12);border-left:4px solid var(--warn)}
.wbmsg.tip{background:var(--chip);color:var(--muted);font-size:13.5px}
.wbpanel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));gap:2px 22px;margin-top:8px}
.wbpt{grid-column:1/-1;font:700 14px var(--f-head);letter-spacing:.5px;text-transform:uppercase;color:var(--accent);margin-top:4px}
.figcard{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 12px;margin:12px 0;max-width:560px}
.figt{font:700 13px var(--f-head);letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
.figsvg{display:block;width:100%;height:auto;color:var(--ink)}
@media (max-width:560px){.wbtools .btn{padding:6px 8px}}
.scnsvg{background:var(--benchbg);border-radius:10px}
.scnctl,.scnpan{margin:8px 0}.scnmsg{margin-top:8px}
.scngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.scncap{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:2px solid var(--line,#8aa);border-radius:10px;background:var(--card,#fff);cursor:pointer;font:inherit;color:inherit}
.scncap.on{border-color:#e0a526;box-shadow:0 0 0 3px #e0a52644}.scncapn{font-weight:800;opacity:.6}.scncapm{font-family:monospace;font-weight:700}
.scnlcd{font-family:monospace;background:#1d2b22;color:#9dffb0;padding:12px 14px;border-radius:8px;margin:8px 0;line-height:1.5;overflow-wrap:anywhere}
.scnsl{display:grid;gap:4px;margin:8px 0}.scnrow input{vertical-align:middle;max-width:55%}
.scnt{border-collapse:collapse;display:block;overflow-x:auto}.scnt td,.scnt th{border:1px solid #8aa;padding:3px 8px;text-align:center}
.wire{transition:opacity .15s}.wire.dim{opacity:.22}.wire.hl .wc{filter:drop-shadow(0 0 4px #ffd54a)}
.term.hl circle{stroke:#ffd54a;stroke-width:3}
.wcol.wauto{width:auto;min-width:22px;padding:0 6px;border-radius:12px;font:700 12px sans-serif;background:var(--card,#fff);color:var(--ink,#222)}
.wcol.wauto.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--accent)}

  return '<rect x="0" y="0" width="150" height="104" rx="10" fill="url(#gBody)" stroke="#20262b" stroke-width="2"/>'+
   '<rect x="8" y="8" width="134" height="20" rx="4" fill="#1d2327"/>'+lbl(75,23,title,{c:'#cfe3d9',s:12,b:1})+
   lcd(14,34,122,38,p.id+'_d','',24)+
   '<g id="'+p.id+'_fz" opacity="0"><rect x="14" y="34" width="122" height="38" rx="4" fill="#3a1010" opacity=".92"/>'+lbl(75,58,'OSIGURAČ PREGORIO',{c:'#ff7a6a',s:12,b:1})+'</g>';
}
PT.amm={
  w:150,h:104,Ra:1,fuse:1,
  terms:function(){return [{id:'p',x:40,y:96,c:'r',l:'A'},{id:'m',x:108,y:96,c:'b',l:'COM'}];},
  draw:function(p){return meterBody(p,'AMPERMETAR '+(p.lab||''),'A');},
  els:function(p,N,S){return [{t:'R',id:p.id,n:[N('p'),N('m')],v:S.blown[p.id]?1e12:PT.amm.Ra}];},
  into:function(p,res,N,S){var I=S.blown[p.id]?0:(res.v[N('p')]-res.v[N('m')])/PT.amm.Ra;return {p:I,m:-I};},
  read:function(p,res,S,ctx){var I=S.blown[p.id]?0:(res.v[ctx.N('p')]-res.v[ctx.N('m')])/PT.amm.Ra;return {i:I};},
  show:function(p,rd,S,q){q('#'+p.id+'_d').textContent=S.blown[p.id]?'':dig(rd.i,'A');q('#'+p.id+'_fz').setAttribute('opacity',S.blown[p.id]?1:0);},
  def:function(){return 0;}
};
PT.vm={
  w:150,h:104,Rv:1e6,
  terms:function(){return [{id:'p',x:40,y:96,c:'r',l:'V'},{id:'m',x:108,y:96,c:'b',l:'COM'}];},
  draw:function(p){return meterBody(p,'VOLTMETAR '+(p.lab||''),'V');},
  els:function(p,N){return [{t:'R',id:p.id,n:[N('p'),N('m')],v:p.Rv||PT.vm.Rv}];},
  into:function(p,res,N){var I=(res.v[N('p')]-res.v[N('m')])/(p.Rv||PT.vm.Rv);return {p:I,m:-I};},
  read:function(p,res,S,ctx){return {u:res.v[ctx.N('p')]-res.v[ctx.N('m')]};},
  show:function(p,rd,S,q){q('#'+p.id+'_d').textContent=dig(rd.u,'V');},
  def:function(){return 0;}
};

PT.sw={
  w:92,h:60,
  terms:function(){return [{id:'a',x:0,y:36,c:'n'},{id:'b',x:92,y:36,c:'n'}];},
  draw:function(p,S){
    return '<rect x="22" y="22" width="48" height="28" rx="5" fill="url(#gBody)" stroke="#20262b" stroke-width="1.6"/><circle cx="26" cy="36" r="4" fill="#bbb"/><circle cx="66" cy="36" r="4" fill="#bbb"/>'+
     '<g class="swclick" style="cursor:pointer" data-sw="'+p.id+'"><line id="'+p.id+'_l" x1="26" y1="36" x2="62" y2="18" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/><rect x="18" y="4" width="56" height="48" fill="transparent"/></g>'+
     lbl(46,12,p.lab||p.id,{s:13,b:1});
  },
  closed:function(p,S){return S.sw[p.id]!=null?S.sw[p.id]:!!p.closed;},
  els:function(p,N,S){return [{t:'R',id:p.id,n:[N('a'),N('b')],v:PT.sw.closed(p,S)?1e-3:1e12}];},
  into:function(p,res,N,S){var I=PT.sw.closed(p,S)?(res.v[N('a')]-res.v[N('b')])/1e-3:0;return {a:I,b:-I};},
  read:function(p,res,S){return {closed:PT.sw.closed(p,S)};},
  show:function(p,rd,S,q){var l=q('#'+p.id+'_l');if(rd.closed){l.setAttribute('x2','62');l.setAttribute('y2','36');}else{l.setAttribute('x2','60');l.setAttribute('y2','16');}},
  ctl:{k:'toggle'},
  def:function(p){return !!p.closed;}
};

PT.pot={
  w:220,h:74,
  terms:function(){return [{id:'1',x:14,y:64,c:'n',l:'1'},{id:'2',x:206,y:64,c:'n',l:'2'},{id:'3',x:110,y:64,c:'n',l:'3'}];},
  draw:function(p){
    return '<rect x="0" y="6" width="220" height="40" rx="8" fill="url(#gBody)" stroke="#20262b" stroke-width="2"/>'+
      '<rect x="14" y="16" width="192" height="12" rx="6" fill="#6a4c2a"/><rect x="14" y="16" width="192" height="4" rx="2" fill="#fff" opacity=".2"/>'+
      '<g id="'+p.id+'_w" class="potw" data-pot="'+p.id+'" style="cursor:ew-resize"><rect x="-8" y="2" width="16" height="42" rx="4" fill="#c9ced3" stroke="#555"/><path d="M0 44 L0 54" stroke="#888" stroke-width="3"/></g>'+
      lbl(110,-2,(p.lab||p.id)+' ('+si(p.Rp,'Ω')+')',{s:13,b:1});
  },
  x:function(p,S){var x=S.v[p.id]!=null?S.v[p.id]:(p.x0!=null?p.x0:0.5);return Math.min(0.999,Math.max(0.001,x));},
  els:function(p,N,S){var x=PT.pot.x(p,S),r1=Math.max(p.Rp*x,1e-3),r2=Math.max(p.Rp*(1-x),1e-3);
    return [{t:'R',id:p.id+'_1',n:[N('1'),N('3')],v:r1},{t:'R',id:p.id+'_2',n:[N('3'),N('2')],v:r2}];},
  into:function(p,res,N,S){var x=PT.pot.x(p,S),a=(res.v[N('1')]-res.v[N('3')])/Math.max(p.Rp*x,1e-3),b=(res.v[N('3')]-res.v[N('2')])/Math.max(p.Rp*(1-x),1e-3);return {'1':a,'3':-a+b,'2':-b};},
  read:function(p,res,S,ctx){var x=PT.pot.x(p,S);return {x:x,R1:p.Rp*x,R2:p.Rp*(1-x),u1:res.v[ctx.N('1')]-res.v[ctx.N('3')],u2:res.v[ctx.N('3')]-res.v[ctx.N('2')]};},
  show:function(p,rd,S,q){q('#'+p.id+'_w').setAttribute('transform','translate('+(14+192*rd.x)+',0)');},
  ctl:{k:'slider',min:0,max:100,step:0.1,unit:'%',label:'Položaj kliznog kontakta'},
  def:function(p){return p.x0!=null?p.x0:0.5;}
};

var DM=['isk','V','A','Ω'];
PT.dmm={
  w:170,h:250,Rv:1e7,Ra:1,fuse:0.5,
  terms:function(){return [{id:'com',x:34,y:240,c:'b',l:'COM'},{id:'v',x:86,y:240,c:'r',l:'VΩ'},{id:'a',x:138,y:240,c:'r',l:'A'}];},
  draw:function(p){
    var s='<rect x="0" y="0" width="170" height="250" rx="16" fill="#e9b72b" stroke="#6d5200" stroke-width="2.5"/>'+
     '<rect x="10" y="10" width="150" height="44" rx="6" fill="#222"/>'+lcd(14,14,142,36,p.id+'_d','',26)+
     '<circle cx="85" cy="128" r="48" fill="#2b2f33" stroke="#111" stroke-width="3"/>'+
     '<g id="'+p.id+'_k"><circle cx="85" cy="128" r="30" fill="#40464c"/><polygon points="82,128 88,128 85,92" fill="#f2f2f2"/></g>';
    var ang=[-90,-35,35,90],names=['OFF','V⎓','A⎓','Ω'];
    names.forEach(function(n,i){var a=(-120+i*80)*Math.PI/180;var tx=85+66*Math.sin(a),ty=128-66*Math.cos(a)+4;s+=lbl(tx,ty,n,{s:12,b:1,c:'#222'});});
    s+='<g class="dmmk" data-dmm="'+p.id+'" style="cursor:pointer"><circle cx="85" cy="128" r="48" fill="transparent"/></g>';
    s+=lbl(85,208,'COM        VΩ        A (0,5 A)',{s:9,c:'#222'});
    return s;
  },
  mode:function(p,S){return S.v[p.id]!=null?S.v[p.id]:(p.mode||0);},
  els:function(p,N,S){
    var m=PT.dmm.mode(p,S),e=[];
    e.push({t:'R',id:p.id+'_v',n:[N('v'),N('com')],v:m===1?PT.dmm.Rv:1e12});
    e.push({t:'R',id:p.id+'_a',n:[N('a'),N('com')],v:S.blown[p.id]?1e12:PT.dmm.Ra});
    return e;
  },
  into:function(p,res,N,S){var m=PT.dmm.mode(p,S);var J=(res.v[N('v')]-res.v[N('com')])/(m===1?PT.dmm.Rv:1e12),I=S.blown[p.id]?0:(res.v[N('a')]-res.v[N('com')])/PT.dmm.Ra;return {v:J,a:I,com:-J-I};},
  read:function(p,res,S,ctx){
    var m=PT.dmm.mode(p,S);
    if(m===1)return {m:1,val:res.v[ctx.N('v')]-res.v[ctx.N('com')],unit:'V'};
    if(m===2)return {m:2,val:S.blown[p.id]?0:(res.v[ctx.N('a')]-res.v[ctx.N('com')])/PT.dmm.Ra,unit:'A',blown:S.blown[p.id]};
    if(m===3)return {m:3,val:ctx.ohm?ctx.ohm(p):null,unit:'Ω'};
    return {m:0};
  },
  show:function(p,rd,S,q){
    var d=q('#'+p.id+'_d'),k=q('#'+p.id+'_k');
    k.setAttribute('transform','rotate('+(-120+rd.m*80+(rd.m===0?0:0))+' 85 128)');
    if(rd.m===0){d.textContent='';return;}
    if(rd.m===2&&rd.blown){d.textContent='FUSE';return;}
    if(rd.val==null||rd.val==='OL'){d.textContent=rd.m===3?'OL Ω':'';return;}
    d.textContent=dig(rd.val,rd.unit);
  },
  ctl:{k:'select',opts:['isključen','V⎓ (napon)','A⎓ (struja)','Ω (otpor)']},
  def:function(p){return p.mode||0;}
};
/* ---------- zarulja / PTC / NTC (nelinearna trosila) ---------- */
PT.nl={
  w:96,h:70,
  terms:function(){return [{id:'a',x:0,y:48,c:'n'},{id:'b',x:96,y:48,c:'n'}];},
  draw:function(p){
    var s='<line x1="0" y1="48" x2="96" y2="48" stroke="#9aa0a6" stroke-width="3"/>';
    if(p.kind==='lamp'){
      s+='<circle id="'+p.id+'_glow" cx="48" cy="26" r="30" fill="#ffd54a" opacity="0"/><circle cx="48" cy="26" r="20" fill="#e8f3ff" fill-opacity=".55" stroke="#8aa" stroke-width="2"/><path d="M40 44 L40 30 Q40 18 48 18 Q56 18 56 30 L56 44" fill="none" stroke="#555" stroke-width="2"/><path id="'+p.id+'_fil" d="M44 28 L48 22 L52 28" fill="none" stroke="#888" stroke-width="2.4"/>';
    }else{
      s+='<rect x="28" y="12" width="40" height="30" rx="8" fill="'+(p.kind==='ptc'?'#2f6fd1':'#d1632f')+'" stroke="#222" stroke-width="2"/>'+lbl(48,32,p.kind==='ptc'?'PTC':'NTC',{c:'#fff',s:12,b:1});
    }
    return s+lbl(48,8,p.lab||p.id,{s:13,b:1})+(p.kind==='lamp'?'':'')+'<text id="'+p.id+'_t" x="48" y="68" text-anchor="middle" font-size="11" fill="currentColor"></text>';
  },
  Rof:function(p,V,S){
    var v=Math.abs(V);
    if(p.kind==='lamp'){return Math.max(25,Math.pow(Math.max(v,1e-6),0.35)/5.27e-3);}
    var R25=p.R25||100;
    var P=v*v/(S.nlR[p.id]||R25),T=25+P*(p.rth||40);T=Math.min(T,180);
    if(p.kind==='ptc'){var f=1+0.006*(T-25)+300/(1+Math.exp(-(T-90)/5));return R25*f/(1+300/(1+Math.exp(-(25-90)/5)));}
    var B=3950;return R25*Math.exp(B*(1/(T+273.15)-1/298.15));
  },
  els:function(p,N,S){
    if(S.burnt[p.id])return [{t:'R',id:p.id,n:[N('a'),N('b')],v:1e12}];
    var R=S.nlR[p.id]||(p.kind==='lamp'?25:(p.R25||100));return [{t:'R',id:p.id,n:[N('a'),N('b')],v:R}];},
  into:function(p,res,N,S){var R=S.nlR[p.id]||(p.R25||100);var I=S.burnt[p.id]?0:(res.v[N('a')]-res.v[N('b')])/R;return {a:I,b:-I};},
  read:function(p,res,S,ctx){var R=S.nlR[p.id]||(p.R25||100),u=res.v[ctx.N('a')]-res.v[ctx.N('b')];var I=S.burnt[p.id]?0:u/R;return {u:u,i:I,R:R,pw:u*I};},
  show:function(p,rd,S,q){
    if(p.kind==='lamp'){var g=q('#'+p.id+'_glow'),fl=q('#'+p.id+'_fil');var b=Math.min(1,rd.pw/0.6);g.setAttribute('opacity',(b*0.85).toFixed(2));fl.setAttribute('stroke',b>0.05?'#fff6c0':'#888');}
    else{var t=q('#'+p.id+'_t');t.textContent=Math.round(25+rd.pw*(p.rth||40))+' °C';}
  },
  nonlinear:true,
  def:function(){return 0;}
};

(function(G){
var H={sw:60,amm:104,bat:92,res:46,iz:110,bz:92,isrc:110};
var W={amm:150,bat:130,res:130,iz:90,bz:130,isrc:90};
function ti(it){ // [ulaz, izlaz] za smjer od 'from' prema 'to'
  if(it.t==='amm')return ['p','m'];
  if(it.t==='res')return ['a','b'];
  if(it.t==='bat'||it.t==='bz')return it.rev?['p','m']:['m','p'];
  if(it.t==='isrc'||it.t==='iz')return it.rev?['p','n']:['n','p'];
  return ['a','b'];}
G.WBL={
 net:function(sp){
  var parts=[],nets=[],nodes={},x=sp.x0||20,junc=[];
  var gap=sp.gap||26,colw=sp.colw||(sp.cw||190),maxy=0;
  sp.cols.forEach(function(c,ci){
    var y=c.y0||34,cx=x+ci*colw,prev=null,first=null;
    c.items.forEach(function(it,k){
      var o={};for(var q in it)o[q]=it[q];o.type=it.t;delete o.t;
      var h=H[it.t]||60,w=W[it.t]||130;
      o.x=cx+Math.round((150-w)/2);o.y=y;if(it.t==='res'){o.pw=it.pw||50;}
      if(it.t==='bat'&&o.R0==null)o.R0=0;
      y+=h+gap;parts.push(o);
      var tt=ti(it),i=o.id+'.'+tt[0],ou=o.id+'.'+tt[1];
      if(prev){var j=[prev,i];nets.push(j);junc.push(j);}else first=i;
      prev=ou;
    });
    (nodes[c.from]=nodes[c.from]||[]).push(first);(nodes[c.to]=nodes[c.to]||[]).push(prev);
    if(y>maxy)maxy=y;
  });
  var xe=x+sp.cols.length*colw;
  (sp.extra||[]).forEach(function(e){var o={};for(var q in e)o[q]=e[q];if(o.x==null)o.x=xe;parts.push(o);});
  Object.keys(sp.link||{}).forEach(function(n){sp.link[n].forEach(function(t){(nodes[n]=nodes[n]||[]).push(t);});});
  Object.keys(nodes).forEach(function(n){nets.push(nodes[n]);});
  (sp.join||[]).forEach(function(pr){var f=null;nets.forEach(function(n){if(n.indexOf(pr[0])>=0)f=n;});if(f)f.push(pr[1]);else nets.push([pr[0],pr[1]]);});
  var res={parts:parts,w:Math.max(940,xe+170),h:Math.max(sp.h||0,maxy+10),target:nets};
  if(sp.taps){ // voltmetar V.p na svakom spoju (V.m na cvoru neg)
    var T=[];
    var all=junc.map(function(j){return j.slice();});
    Object.keys(nodes).forEach(function(n){if(n!==sp.taps.neg)all.push(nodes[n].slice());});
    all.forEach(function(net){
      var cp=nets.map(function(s){return s.slice();});
      cp.forEach(function(s){if(s.indexOf(net[0])>=0)s.push(sp.taps.id+'.p');if(nodes[sp.taps.neg]&&s.indexOf(nodes[sp.taps.neg][0])>=0)s.push(sp.taps.id+'.m');});
      T.push(cp);});
    res.targets=T;
  }
  return res;
 }
};
})(window);
