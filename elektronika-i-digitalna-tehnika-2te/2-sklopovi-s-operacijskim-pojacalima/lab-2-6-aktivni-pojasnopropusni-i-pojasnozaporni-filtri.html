<!DOCTYPE html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtualni laboratorij</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap"><style>
/* Koncept: radni stol u školskom laboratoriju. Gore traka s nazivom i karticama, ispod "stol" s instrumentima, ispod zadaci i pitanja. */
:root{
  --bg:#eef1ee; --panel:#ffffff; --ink:#1b2422; --muted:#56635e; --line:#d2d9d5;
  --accent:#0b7a6b; --accent-ink:#ffffff; --warn:#a85a00; --chip:#e3ebe7;
  --badge:#10181a;
  --f-head:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-lcd:'Share Tech Mono','Courier New',monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111716; --panel:#192120; --ink:#e5ebe8; --muted:#9aa8a2; --line:#2d3836;
    --accent:#42c6b0; --accent-ink:#06211c; --warn:#f0a64a; --chip:#232d2b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111716; --panel:#192120; --ink:#e5ebe8; --muted:#9aa8a2; --line:#2d3836;
  --accent:#42c6b0; --accent-ink:#06211c; --warn:#f0a64a; --chip:#232d2b; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.logo{display:block;background:var(--badge);border-radius:10px;padding:6px;line-height:0;flex:none}
.logo img{height:68px;width:auto;display:block}
.logo:focus-visible,.tab:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.titles{min-width:0;flex:1 1 280px}
h1{font-family:var(--f-head);font-weight:700;font-size:clamp(26px,4.6vw,38px);line-height:1.05;margin:0;letter-spacing:.2px;text-wrap:balance}
.by{margin:6px 0 0;color:var(--muted);font-size:13.5px}
.by a{color:var(--accent);font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 14px var(--f-head);letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:8px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
h2{font-family:var(--f-head);font-size:26px;line-height:1.15;margin:0 0 4px;font-weight:700}
h3{font-family:var(--f-head);font-size:19px;margin:22px 0 6px;font-weight:600;letter-spacing:.2px}
.lead{color:var(--muted);margin:0 0 12px;max-width:70ch}
ol.q{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px;max-width:74ch}
ol.q li::marker{font-family:var(--f-head);font-weight:700;color:var(--accent)}
.note{background:var(--chip);border-radius:8px;padding:10px 14px;font-size:14px;max-width:74ch;margin:12px 0 0}
.note b{font-weight:600}
.bench-wrap{border:1px solid #0d1514;border-radius:10px;overflow-x:auto;background:#2b3a38}
.bench{min-width:820px;display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bench [data-act]{cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.btn{font:600 13px var(--f-head);letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer}
.teacher{border:1px dashed var(--warn);border-radius:10px;padding:14px 18px;margin-top:18px}
.teacher h3{margin-top:0;color:var(--warn)}
.teacher table{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.teacher th,.teacher td{border:1px solid var(--line);padding:4px 9px;text-align:right}
.scroll{overflow-x:auto}
footer{color:var(--muted);font-size:13px;max-width:80ch}
footer a{color:var(--accent);font-weight:600}
[hidden]{display:none!important}
@media (max-width:560px){.card{padding:16px 14px}.logo img{height:54px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- dodatak: instrumenti i sheme ---- */
.bench2{display:flex;flex-direction:column}
.schemwrap{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow-x:auto;--tp:var(--accent)}
.schem{display:block;width:100%;min-width:680px;height:auto;color:var(--ink);user-select:none;-webkit-user-select:none}
.tp{cursor:pointer;outline:none}
.tpc{fill:var(--panel);stroke:var(--accent);stroke-width:2.6}
.tp:hover .tpc,.tp:focus-visible .tpc{fill:var(--accent)}
.tp.red .tpc{fill:#e0483a;stroke:#9b241b}
.tp.blk .tpc{fill:#2a2f31;stroke:#000}
.tp.c1 .tpc{stroke:#e8b600;stroke-width:4.5}
.tp.c2 .tpc{stroke:#0aa5d8;stroke-width:4.5}
.inst-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(310px,100%),1fr));gap:14px;margin-top:14px}
.ic{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.ic.wide{grid-column:1/-1}
.ic h4{font:700 15px var(--f-head);letter-spacing:.5px;text-transform:uppercase;margin:0 0 8px;color:var(--accent)}
.prow{display:grid;grid-template-columns:92px minmax(0,1fr) 92px;gap:10px;align-items:center;margin:8px 0}
.prow.sel{grid-template-columns:128px minmax(0,1fr)}
.prow label{font-size:14px}
.prow input[type=range]{width:100%;accent-color:var(--accent)}
.prow output{font:500 14px var(--f-lcd);text-align:right;white-space:nowrap}
.prow select,.chb select{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
.krow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:-2px 0 8px}
.kb{font:600 13px var(--f-lcd);border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:5px;padding:3px 8px;cursor:pointer}
.kb:hover{border-color:var(--accent)}
.lcd{background:#0c1a12;color:#6df0a8;border-radius:8px;padding:10px 14px;font-family:var(--f-lcd);display:flex;align-items:baseline;gap:8px;margin-bottom:10px;border:2px solid #07110b}
.lcd #lcdv{font-size:40px;line-height:1;letter-spacing:1px;flex:1;text-align:right}
.lcd #lcdu{font-size:22px;min-width:2.6em}
.lcd #lcdm{font-size:13px;opacity:.8;min-width:5.2em;text-align:right}
.seg{display:flex;gap:0;margin-bottom:8px}
.seg button{flex:1;font:600 14px var(--f-lcd);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 4px;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dotr,.dotb{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.dotr{background:#e0483a}.dotb{background:#2a2f31;border:1px solid var(--muted)}
.pick{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px;align-items:center}
.pick label{display:flex;gap:4px;align-items:center;color:var(--ink)}
.scopegrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:start}
@media (max-width:760px){.scopegrid{grid-template-columns:1fr}}
.scope canvas,.bode canvas,.ll canvas{width:100%;height:auto;display:block;border-radius:8px;border:1px solid #0d1514}
.bode canvas,.ll canvas{border:1px solid var(--line);background:var(--bg)}
.scrd{font:500 14px var(--f-lcd);margin-top:6px;min-height:22px;color:var(--muted)}
.scrd b{color:var(--ink)}
.scctl{display:flex;flex-direction:column;gap:10px}
.chb{border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.chb b{font:700 14px var(--f-head);letter-spacing:.5px}
.chb.c1 b{color:#c99a00}.chb.c2 b{color:#0786b3}
.chb label{display:flex;gap:6px;align-items:center;justify-content:space-between}
.chk{display:flex;gap:8px;align-items:center;font-size:13.5px;margin-top:8px;color:var(--muted)}
.ans{margin-top:6px;padding:6px 10px;border-left:3px solid var(--warn);background:rgba(168,90,0,.07);font-size:14px;border-radius:0 6px 6px 0}
.ans.wide{max-width:none}
.zad{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:10px 0;display:grid;gap:10px}
.zad .zadf{max-width:420px}
.zad .zadf svg{width:100%;height:auto;color:var(--ink)}
.tt{border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;margin:6px 0}
.tt th,.tt td{border:1px solid var(--line);padding:3px 9px;text-align:right;white-space:nowrap}
.tt th{background:var(--chip);font-weight:600}
.teacher p{margin:6px 0;font-size:14px;max-width:80ch}
.teacher h5{font:700 15px var(--f-head);margin:12px 0 2px;letter-spacing:.3px}
.formula{font-family:'IBM Plex Sans',serif;font-style:normal}
.task .step-fig{margin:8px 0}
@media (max-width:560px){.prow{grid-template-columns:78px minmax(0,1fr) 78px}.lcd #lcdv{font-size:32px}}
.inst-grid>*{min-width:0}
.prow select,.chb select{min-width:0;width:100%;text-overflow:ellipsis}.prow>*{min-width:0}@media (max-width:560px){.prow.sel{grid-template-columns:96px minmax(0,1fr)}}
@media (max-width:560px){.prow output{white-space:normal;overflow-wrap:anywhere;font-size:12px}}

App.prototype.compute=function(){

  this.op=this.sim.dcOp();

};
App.prototype.acG=function(){if(!this.acr)this.acr=this.sim.ac(this.Gn.f);return this.acr;};
App.prototype.update=function(){

/* ---------- multimetar ---------- */
App.prototype.nodeV=function(n){return n==='0'?0:this.op.v[n];};
App.prototype.tranStat=function(a,b){
  var td=this.runTran(),A=td.v[a]||null,B=td.v[b]||null,n=(A||B||[]).length;
  if(!n)return {mean:0,rms:0};
  var x=new Array(n),i;for(i=0;i<n;i++)x[i]=(A?A[i]:0)-(B?B[i]:0);
  var m0=0;for(i=0;i<n;i++)m0+=x[i];m0/=n;
  var c=[];for(i=1;i<n;i++)if(x[i-1]<m0&&x[i]>=m0)c.push(i);
  var lo=0,hi=n;if(c.length>=2){lo=c[0];hi=c[c.length-1];}
  var m=0,q=0,k=hi-lo;for(i=lo;i<hi;i++)m+=x[i];m/=k;for(i=lo;i<hi;i++)q+=(x[i]-m)*(x[i]-m);
  return {mean:m,rms:Math.sqrt(q/k)};
};
App.prototype.drawDmm=function(){
  if(this.inst.indexOf('dmm')<0)return;
  var d=this.dmm,v,u='V',m='DC',self=this;
  document.querySelectorAll('#fnseg button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-fn')===d.fn);});
  var mrow=document.getElementById('dm_mrow'),crow=document.getElementById('dm_crow');
  if(mrow)mrow.style.display=d.fn==='cur'?'none':'';
  if(crow)crow.style.display=d.fn==='cur'?'':'none';
  var pr=document.querySelector('.dmm .pick');if(pr)pr.style.display=d.fn==='cur'?'none':'';
  var txt;
  if(this.cfg.dmmTran&&d.fn!=='cur'){
    var ts=this.tranStat(d.plus,d.minus);
    if(d.fn==='dc'){v=ts.mean;m='DC';}else{v=ts.rms;m='AC (ef.)';}
    txt=si(v,'V',4);
  }else if(d.fn==='dc'){
    v=this.nodeV(d.plus)-this.nodeV(d.minus);m='DC';txt=si(v,'V',4);
  }else if(d.fn==='ac'){
    var r=this.acG(),a=r[d.plus]||{re:0,im:0},b=r[d.minus]||{re:0,im:0};
    v=G.cabs(G.csub(a,b))/Math.SQRT2;m='AC (ef.)';txt=si(v,'V',4);
  }else{
    var cur=this.op.i[d.cur];v=cur==null?0:cur;m='DC';txt=si(v,'A',4);
  }
  if(!this.op.ok)txt='Err';
  var parts=txt.split(' ');
  document.getElementById('lcdv').textContent=parts[0];
  document.getElementById('lcdu').textContent=parts[1]||'';
  document.getElementById('lcdm').textContent=m;
};
/* ---------- osciloskop ---------- */
App.prototype.waveFns=function(){
  var self=this,sc=this.sc;
  var mode=(this.cfg.scope&&this.cfg.scope.mode)||'phasor';
  var w=2*Math.PI*this.Gn.f;
  function ph(n){var r=self.acG();return r[n]||{re:0,im:0};}
  function mk(n,cpl){
    if(n==='0')return function(){return 0;};
    var cl=self.cfg.clip&&self.cfg.clip(self,n);
    if(cl)return function(t){return cl(t,cpl);};
    var dc=self.op.v[n]||0,p=ph(n);
    return function(t){return (cpl==='DC'?dc:0)+(p.re*Math.sin(w*t)+p.im*Math.cos(w*t));};
  }
  if(mode==='phasor')return {f1:mk(sc.ch1,sc.c1),f2:mk(sc.ch2,sc.c2),t0:0};
  /* tranzijent */
  var td=this.runTran();
  function mkT(n,cpl){
    if(n==='0'||!td.v[n])return function(){return 0;};
    var arr=td.v[n],mean=0;for(var i=0;i<arr.length;i++)mean+=arr[i];mean/=arr.length;
    return function(t){
      var x=t/td.dt,i=Math.floor(x);if(i<0||i>=arr.length-1)return NaN;
      var v=arr[i]+(arr[i+1]-arr[i])*(x-i);return cpl==='DC'?v:v-mean;};
  }
  return {f1:mkT(sc.ch1,sc.c1),f2:mkT(sc.ch2,sc.c2),t0:0};
};
App.prototype.runTran=function(){
  var cfg=this.cfg,sc=this.sc,tr=cfg.tran||{};
  var key=[sc.tdiv,this._key,sc.ch1,sc.ch2].join('|');
  if(this._tk===key&&this.tranD)return this.tranD;
  var win=sc.tdiv*10,per=1/Math.max(this.Gn.f,1),h=Math.max(win/1500,tr.hmin||2e-7);
  if(tr.hmax&&h>tr.hmax)h=tr.hmax;
  var settle=typeof tr.settle==='function'?tr.settle(this.P,this.Gn):(tr.settle||0);
  var nodes=cfg.nodes.map(function(n){return n.k;});
  var res=this.sim.tran({tstop:settle+win+per*1.2,h:h,tskip:settle,nodes:nodes,be:!!tr.be});
  /* okidač: prvi uzlazni prolaz kroz srednju vrijednost kanala 1 */
  var arr=res.v[sc.ch1]||[],off=0;
  if(arr.length){
    var mean=0,i;for(i=0;i<arr.length;i++)mean+=arr[i];mean/=arr.length;
    for(i=1;i<arr.length-1;i++){if(arr[i-1]<mean&&arr[i]>=mean){off=i;break;}}
    var out={dt:h,v:{}};
    Object.keys(res.v).forEach(function(k){out.v[k]=res.v[k].slice(off);});
    this.tranD=out;
  }else this.tranD={dt:h,v:{},fail:true};
  this._tk=key;
  return this.tranD;
};
App.prototype.drawScope=function(){
  var cv=document.getElementById('scv');if(!cv)return;
  var ctx=cv.getContext('2d'),W=cv.width,H=cv.height,sc=this.sc;
  ctx.fillStyle='#0b1311';ctx.fillRect(0,0,W,H);
  var gx=W/10,gy=H/8;
  ctx.strokeStyle='rgba(120,170,150,.28)';ctx.lineWidth=1;
  for(var i=0;i<=10;i++){ctx.beginPath();ctx.moveTo(i*gx,0);ctx.lineTo(i*gx,H);ctx.stroke();}
  for(var j=0;j<=8;j++){ctx.beginPath();ctx.moveTo(0,j*gy);ctx.lineTo(W,j*gy);ctx.stroke();}
  ctx.strokeStyle='rgba(150,200,180,.55)';
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();
  /* sitne podjele */
  ctx.strokeStyle='rgba(150,200,180,.5)';
  for(var a=0;a<=50;a++){var x=a*gx/5;ctx.beginPath();ctx.moveTo(x,H/2-4);ctx.lineTo(x,H/2+4);ctx.stroke();}
  for(var b2=0;b2<=40;b2++){var y=b2*gy/5;ctx.beginPath();ctx.moveTo(W/2-4,y);ctx.lineTo(W/2+4,y);ctx.stroke();}
  var wf=this.waveFns(),self=this,N=900,tt=sc.tdiv*10;
  function trace(f,vd,col){
    ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();var st=false;
    for(var k=0;k<=N;k++){
      var t=tt*k/N,v=f(t);
      if(!isFinite(v)){st=false;continue;}
      var yy=H/2-v/vd*gy,xx=W*k/N;
      if(yy<-2)yy=-2;if(yy>H+2)yy=H+2;
      if(!st){ctx.moveTo(xx,yy);st=true;}else ctx.lineTo(xx,yy);
    }
    ctx.stroke();
  }
  var show1=sc.ch1!=='0',show2=sc.ch2!=='0';
  if(show1)trace(wf.f1,sc.v1,CH1);
  if(show2)trace(wf.f2,sc.v2,CH2);
